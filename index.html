<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เกมไก่วิ่งหลบสิ่งกีดขวาง (Chicken Run)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #eef2f3;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            user-select: none;
            overflow: hidden;
        }

        h1 {
            color: #333;
            margin-bottom: 5px;
            font-size: 1.8rem;
        }

        .score-board {
            font-size: 1.1rem;
            color: #555;
            margin-bottom: 15px;
            font-weight: bold;
        }

        /* กล่องครอบ Canvas */
        .game-container {
            position: relative;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            border-radius: 10px;
            overflow: hidden;
        }

        canvas {
            background-color: #f7f7f7;
            display: block;
            cursor: pointer;
        }

        /* หน้าจอจำลองเมื่อ Game Over */
        .overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
        }

        .overlay h2 {
            font-size: 2.5rem;
            color: #ff4757;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .overlay p {
            background-color: #333;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 1rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <h1>Chicken Jump! 🐔</h1>
    <div class="score-board">คะแนน: <span id="score">0</span> | คะแนนสูงสุด: <span id="highScore">0</span></div>

    <div class="game-container">
        <canvas id="gameCanvas" width="600" height="250"></canvas>
        <div id="gameOverOverlay" class="overlay">
            <h2>GAME OVER</h2>
            <p>กด Spacebar หรือ แตะหน้าจอเพื่อเริ่มใหม่</p>
        </div>
    </div>
